name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lean-action-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bounds Lake's runtime pool and every Lean subprocess it launches.
      LEAN_NUM_THREADS: "1"
      PUBLIC_SOURCE_MODE: ${{ github.event.repository.private != true }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Pull requests must be classified at their actual head commit.  The
          # default synthetic merge commit would make an otherwise linear paper
          # branch look like it contains a forbidden merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # No contributor-controlled build or Lean code should inherit a token
          # capable of writing back to the repository.
          persist-credentials: false
          # The append-only engine ledger is checked against the trusted event
          # base, including multi-commit pushes and pull requests.
          fetch-depth: 0
      - name: Configure trusted CI workspace
        if: github.event_name == 'pull_request'
        run: >-
          echo "TRUSTED_CI_ROOT=$RUNNER_TEMP/econcslib-trusted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          >> "$GITHUB_ENV"
      - name: Materialize trusted CI implementation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$TRUSTED_CI_ROOT"
          git archive "$BASE_SHA" scripts config | tar -x -C "$TRUSTED_CI_ROOT"
      - name: Classify pull request scope
        id: contribution-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -f "$TRUSTED_CI_ROOT/scripts/paper_contribution.py" ]]; then
            python3 "$TRUSTED_CI_ROOT/scripts/paper_contribution.py" scope \
              --repo "$GITHUB_WORKSPACE" \
              --base "$BASE_SHA" \
              --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          else
            # The one-time rollout PR predates the trusted classifier.  It may
            # use only the broad integration lane, never a narrowed paper lane.
            {
              echo "mode=integration"
              echo "paper="
              echo "new_paper=false"
              echo "profile=none"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Check formalization engine revision (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE_MODE: ${{ steps.contribution-scope.outputs.mode }}
        run: |
          TRUSTED_CHECKER="$TRUSTED_CI_ROOT/scripts/check_formalization_engine_revision.py"
          if [[ -f "$TRUSTED_CHECKER" ]] && \
              python3 "$TRUSTED_CHECKER" --help | grep -q -- "--repo"; then
            python3 "$TRUSTED_CHECKER" \
              --repo "$GITHUB_WORKSPACE" \
              --tree HEAD \
              --base-tree "$BASE_SHA"
          elif [[ -f "$TRUSTED_CHECKER" ]]; then
            # Compatibility for the rollout base: the older trusted checker
            # discovers its repository from cwd and still reads exact trees.
            cd "$GITHUB_WORKSPACE"
            python3 "$TRUSTED_CHECKER" \
              --tree HEAD \
              --base-tree "$BASE_SHA"
          elif [[ "$SCOPE_MODE" == "integration" ]]; then
            # A repository predating the engine guard may bootstrap it only in
            # the broad lane. No candidate-controlled narrowed lane is allowed.
            python3 scripts/check_formalization_engine_revision.py \
              --repo "$GITHUB_WORKSPACE" \
              --tree HEAD \
              --base-tree "$BASE_SHA"
          else
            echo "trusted base has no formalization engine checker" >&2
            exit 1
          fi
      - name: Check formalization engine revision (push)
        if: github.event_name == 'push'
        run: >-
          python3 scripts/check_formalization_engine_revision.py
          --tree HEAD --base-tree ${{ github.event.before }}
      - name: Check aggregate projection after main push
        if: github.event_name == 'push'
        run: |
          set +e
          python3 scripts/sync_paper_status.py --aggregate-only --check
          status=$?
          set -e
          if [[ "$status" -eq 1 ]]; then
            echo "::warning::paper aggregates need a mechanical aggregate-only follow-up PR"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
      - name: Check committed pull request formatting
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD --
      - name: Check aggregate-only contribution
        if: >-
          github.event_name == 'pull_request' &&
          steps.contribution-scope.outputs.mode == 'aggregate'
        run: >-
          python3 "$TRUSTED_CI_ROOT/scripts/sync_paper_status.py"
          --repo "$GITHUB_WORKSPACE" --aggregate-only --check
      - name: Check formalization engine revision (manual)
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python3 scripts/check_formalization_engine_revision.py
          --tree HEAD --base-tree HEAD^
      - name: Select changed-work validation
        id: change-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            SCOPE_TOOL="$TRUSTED_CI_ROOT/scripts/ci_change_scope.py"
          else
            SCOPE_TOOL="$GITHUB_WORKSPACE/scripts/ci_change_scope.py"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Include earlier failed, canceled, or superseded pending changes.
            # An unavailable baseline safely selects the full integration lane.
            EVENT_BASE=""
            RUNS_FILE="$RUNNER_TEMP/successful-main-runs.json"
            if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lean_action_ci.yml/runs?branch=main&event=push&status=success&per_page=100" > "$RUNS_FILE"; then
              EVENT_BASE=$(python3 "$SCOPE_TOOL" successful-main-base \
                --repo "$GITHUB_WORKSPACE" --head HEAD --runs-json "$RUNS_FILE" \
                --repository "$GITHUB_REPOSITORY")
            fi
          fi
          echo "CI_SCOPE_TOOL=$SCOPE_TOOL" >> "$GITHUB_ENV"
          echo "CI_BASE_SHA=$EVENT_BASE" >> "$GITHUB_ENV"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$EVENT_BASE" || "$EVENT_BASE" =~ ^0+$ || ! -f "$SCOPE_TOOL" ]]; then
            echo "mode=integration" >> "$GITHUB_OUTPUT"
            echo "build_lean=true" >> "$GITHUB_OUTPUT"
          else
            python3 "$SCOPE_TOOL" plan --repo "$GITHUB_WORKSPACE" \
              --base "$EVENT_BASE" --head HEAD --github-output "$GITHUB_OUTPUT"
          fi
      - name: Make room for Lean build artifacts
        if: steps.change-scope.outputs.mode != 'docs' && runner.environment == 'github-hosted'
        # Lean and its caches need more disk than the default image leaves free.
        # These fixed SDK directories are unused by this Linux Lean workflow.
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo "Refusing SDK cleanup outside a GitHub-hosted runner." >&2
            exit 1
          fi
          df -h .
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h .
      - name: Set up Lean dependencies
        if: steps.change-scope.outputs.mode != 'docs'
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # The private workspace expands beyond the hosted runner's free disk
          # when lean-action restores its compressed whole-.lake cache.  Keep
          # the separate Mathlib cache, but build project artifacts fresh.
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Restore project build cache
        if: steps.change-scope.outputs.mode != 'docs'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-aml-project-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-aml-project-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Remove obsolete cached module interfaces
        if: steps.change-scope.outputs.mode != 'docs'
        run: |
          if [[ -f "$CI_SCOPE_TOOL" ]]; then
            python3 "$CI_SCOPE_TOOL" prune-cache --repo "$GITHUB_WORKSPACE" --base HEAD --head HEAD
          fi
      - name: Check isolated paper contribution
        if: >-
          github.event_name == 'pull_request' &&
          steps.contribution-scope.outputs.mode == 'paper'
        env:
          PAPER: ${{ steps.contribution-scope.outputs.paper }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 "$TRUSTED_CI_ROOT/scripts/paper_contribution.py" check "$PAPER"
          --repo "$GITHUB_WORKSPACE"
          --base "$BASE_SHA"
          --allow-missing-source-bytes
      - name: Build changed papers and their dependents
        if: >-
          steps.change-scope.outputs.mode == 'papers' &&
          (github.event_name != 'pull_request' || steps.contribution-scope.outputs.mode != 'paper')
        run: >-
          python3 "$CI_SCOPE_TOOL" build --repo "$GITHUB_WORKSPACE"
          --base "$CI_BASE_SHA" --head HEAD
      - name: Validate selected paper evidence
        if: >-
          steps.change-scope.outputs.mode == 'papers' &&
          (github.event_name != 'pull_request' || steps.contribution-scope.outputs.mode != 'paper')
        run: |
          SOURCE_FLAG=()
          if [[ "$PUBLIC_SOURCE_MODE" == "true" ]]; then SOURCE_FLAG+=(--public); fi
          python3 "$CI_SCOPE_TOOL" check --repo "$GITHUB_WORKSPACE" \
            --base "$CI_BASE_SHA" --head HEAD "${SOURCE_FLAG[@]}"
      - name: Build Lean targets
        if: steps.change-scope.outputs.mode == 'integration'
        # defaultTargets intentionally excludes some private/new paper targets.
        # Integration must still compile every registered lean_lib.
        run: python3 scripts/paper_target_registration.py build-all
      - name: Test semantic provenance audits
        if: steps.change-scope.outputs.mode == 'integration'
        run: python3 scripts/run_isolated_audit_tests.py
      - name: Audit conclusion-bearing theorem inputs
        if: steps.change-scope.outputs.mode == 'integration'
        run: python3 scripts/audit_conclusion_provenance.py
      - name: Check paper status aggregate
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          steps.change-scope.outputs.mode == 'integration')
        run: python3 scripts/sync_paper_status.py --check
      - name: Audit source-evidence integrity
        if: steps.change-scope.outputs.mode == 'integration'
        run: |
          SOURCE_FLAG=()
          if [[ "$PUBLIC_SOURCE_MODE" == "true" ]]; then SOURCE_FLAG+=(--allow-missing-source-bytes); fi
          python3 scripts/audit_evidence_integrity.py "${SOURCE_FLAG[@]}"
      - name: Audit reusable library provenance
        if: steps.change-scope.outputs.mode == 'integration'
        run: python3 scripts/audit_repository.py --library-only --library-premise-audit --info-limit 0
      - name: Audit statement translations
        if: steps.change-scope.outputs.mode == 'integration'
        run: python3 scripts/review_dashboard.py --statement-check
      - name: Audit paper coverage
        if: steps.change-scope.outputs.mode == 'integration'
        run: python3 scripts/review_dashboard.py --paper-coverage-check
      - name: Full repository closeout audit
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          steps.change-scope.outputs.mode == 'integration')
        run: |
          SOURCE_FLAG=()
          if [[ "$PUBLIC_SOURCE_MODE" == "true" ]]; then SOURCE_FLAG+=(--allow-missing-source-bytes); fi
          python3 scripts/audit_repository.py --include-active --library-premise-audit --info-limit 0 "${SOURCE_FLAG[@]}"
      - name: Save trusted main project build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.change-scope.outputs.mode != 'docs'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-aml-project-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
