name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "papers/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'nikhgarg/EconCSLib' || github.repository == 'nikhgarg/AppliedModelingLib'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install document renderer
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Test published document rendering
        run: python3 -m unittest discover -s site -p 'test_*.py'

      - name: Build website and paper documents
        run: python3 site/build_public_site.py --output "$RUNNER_TEMP/published-site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/published-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: "600000"
