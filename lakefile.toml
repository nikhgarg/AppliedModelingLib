name = "AppliedModelingLib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = [
  "AppliedModelingLib",
  "DGD26AdmissionsPredictability",
  "DSWG24DiscretizationBias",
  "EOS07GSP",
  "FalahatgarEtAl2017MaxingRanking",
  "FreundSchapire1997Hedge",
  "GCG24UserItemFairness",
  "GGRS26CombattingGerrymanderingRCV",
  "GGSG19TopThree",
  "GHKR22BiasBounties",
  "GHW01DigitalGoods",
  "GJ18InformativeRatingSystems",
  "GJ19OptimalBinaryRatingSystems",
  "GKGMM19IterativeLocalVoting",
  "GN21DriverSurgePricing",
  "GS62CollegeAdmissions",
  "GeEtAl2024AlignmentAxioms",
  "HT26EFXChores",
  "JGS23SupplySideRecommenderSystems",
  "KR21Monoculture",
  "LBG24SpatialUnderreporting",
  "LG21TestOptionalPolicies",
  "LG24ServiceLevelAgreements",
  "LMMS04FairDivision",
  "LOS02CombinatorialAuctions",
  "MBJG25ProducerFairness",
  "MSVV07AdWords",
  "MendelsonWhang1990PriorityPricing",
  "Naor1969QueueTolls",
  "NoothigattuEtAl2020PairwiseComparisons",
  "PG23MonocultureMatching",
  "PG24NoisyMatchingMarkets",
  "PKG25NoFreeLunch",
  "PRPKG24AccuracyDiversity",
  "PZMH20PerformativePrediction",
  "Roth82StableMatching",
  "SeshadriUgander2020IIATesting",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.unnecessarySimpa = false
weak.linter.unusedDecidableInType = false
weak.linter.unusedFintypeInType = false
weak.linter.unusedSectionVars = false
weak.linter.unusedVariables = false
weak.linter.flexible = false
weak.linter.style.longLine = false
weak.linter.style.whitespace = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.30.0-rc2"

# Full Kantorovich--Rubinstein duality for W₁.  Pinned immutably; see
# docs/UPSTREAM_LEAN_SOURCES.md for provenance, compatibility, and license audit.
[[require]]
name = "Vlasov"
git = "https://github.com/Hydrodynamical/Vlasov_Meanfield_Formalization.git"
rev = "b2eda09e58ceebad6cf23b8a7a6839001d4e7c15"
subDir = "Vlasov"

[[lean_lib]]
name = "AppliedModelingLib"

[[lean_lib]]
name = "AppliedModelingLibAuditScripts"
srcDir = "scripts"
roots = ["lean_signature_manifest_helper"]

[[lean_lib]]
name = "DGD26AdmissionsPredictability"
srcDir = "papers"

[[lean_lib]]
name = "DSWG24DiscretizationBias"
srcDir = "papers"

